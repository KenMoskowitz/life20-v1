<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Your Life 2.0 Private Advisory application has been received." />
    <title>Application Received — Life 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      :root { --forest:#0e251c; --bone:#f6f2e8; --brass:#d7af60; --mono:"DM Mono",monospace; --serif:"Playfair Display",Georgia,serif; }
      * { box-sizing:border-box; } body { min-height:100vh; display:grid; place-items:center; margin:0; padding:28px; color:var(--bone); background:var(--forest); }
      main { width:min(700px,100%); text-align:center; } .brand { color:var(--bone); font:500 32px/1 var(--serif); letter-spacing:-.06em; text-decoration:none; } .brand b { color:var(--brass); font-weight:500; }

    </style>
  </head>
  <body><main><a class="brand" href="/">Life <b>2.0</b></a><div class="kicker">Application received</div><h1>Thank you for applying.</h1><p>Laura will review your application personally. If it appears that the Private Advisory could be the right fit, you will receive an invitation to book a private call.</p><a class="btn" href="/">Return to Life 2.0</a></main></body>
</html>
