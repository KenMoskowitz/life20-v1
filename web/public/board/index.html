<style>

.opts{display:grid;gap:12px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;font-size:17px;color:var(--fg)}

.bctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;max-width:760px;margin-bottom:20px}

.bact{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.toast{font-size:14px;color:var(--fg-soft)}

.to{grid-area:to}.aw{grid-area:aw}.rl{grid-area:rl}.re{grid-area:re}.pv{grid-area:pv}.vi{grid-area:vi}.go{grid-area:go}

var S=load(),v=startView();

function curE(){return MODS[v.m].ex[v.ex]}
function lst(e){return get(S.a,e.path)||[]}
function cnt(e){return lst(e).filter(function(x){return x&&x.v&&x.v.trim()}).length}
function clean(){var e=v.screen==='ex'&&curE();if(e&&e.kind==='list'){setp(S.a,e.path,lst(e).filter(function(x){return x&&x.v&&x.v.trim()}));save()}}

function tileFilled(id){var a=S.a,t=function(x){return !!(x&&String(x).trim())};
 switch(id){case'mi':return t(a.mission);case'rl':return t(a.richLife.personal)&&t(a.richLife.professional)&&t(a.richLife.financial);case'to':return top(a.towards,9).length>=3;case'aw':return top(a.away,9).length>=2;case're':return t(a.relationship);case'pv':return t(a.professional);case'vi':return top(a.virtues,9).length>=3;case'go':return (a.goals||[]).every(function(g){return g&&t(g.goal)});case'pq':return t(a.pqNew)}return false}

 return '<div class="thumbl">My board</div><div class="thumb" aria-hidden="true"><div class="th hd"></div>'+ids.map(function(id){return '<div class="th '+id+(tileFilled(id)?' on':'')+(cur===id?' cur':'')+'"></div>'}).join('')+'</div><div class="thumbc">'+(cur?'Adds to: '+TN[cur]:'Private. Not on your board.')+'</div>'}

 else{hdH=2.6*U*1.3+3*U*1.3+(co?SZ*1.8:0);(function(yy){ops.push(function(){var l=logo(2.6*U),tot=l[0]+l[1];drawLogo(W/2-tot/2,yy+2.6*U,2.6*U);c.font='600 '+Math.round(3*U)+'px '+PF;c.fillStyle=C.fg;c.textAlign='center';c.fillText(a.name||'',W/2,yy+2.6*U*1.3+3*U);if(co)drawSp(co,W/2-sp(co)/2,yy+2.6*U*1.3+3*U*1.3+SZ*1.2)})})(y)}

function loadFonts(){var f=["600 40px 'Playfair Display'","500 40px 'Playfair Display'","italic 500 40px 'Playfair Display'","italic 600 40px 'Playfair Display'","600 40px Inter","400 40px Inter","500 40px 'DM Mono'"];return Promise.all(f.map(function(x){return document.fonts.load(x,'Aa life 2.0')})).catch(function(){})}
function makePDF(jpeg,w,h){
 var pw=792,ph=Math.round(792*h/w*100)/100,enc=new TextEncoder(),parts=[],offs=[],len=0;
 function push(b){parts.push(b);len+=b.length}
 function str(s){push(enc.encode(s))}
 function obj(n,body){offs[n]=len;str(n+' 0 obj\n'+body+'\nendobj\n')}
 str('%PDF-1.4\n');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offs[4]=len;str('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');push(jpeg);str('\nendstream\nendobj\n');
 var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
 obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
 var xr=len;str('xref\n0 6\n0000000000 65535 f \n');
 for(var n=1;n<=5;n++)str(('0000000000'+offs[n]).slice(-10)+' 00000 n \n');
 str('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'})}
function dlBlob(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},5000)}
function fileBase(){return ((S.a.name||'My').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'My')+'-Life2-Board'}
function busy(on){document.querySelectorAll('[data-act="pdf"],[data-act="png"]').forEach(function(b){b.disabled=on})}

function exportPNG(){
